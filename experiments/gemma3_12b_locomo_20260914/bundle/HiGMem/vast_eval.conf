[program:higmem-eval]
command=/venv/main/bin/python -u run_vast.py
directory=/workspace/HiGMem
environment=HF_HOME="/workspace/.hf_home",CUDA_VISIBLE_DEVICES="",OMP_NUM_THREADS="2",TOKENIZERS_PARALLELISM="false",HF_HUB_OFFLINE="0",TRANSFORMERS_OFFLINE="0"
autostart=false
autorestart=false
redirect_stderr=true
stdout_logfile=/workspace/HiGMem/eval.log
stdout_logfile_maxbytes=50000000
stdout_logfile_backups=1
stopasgroup=true
killasgroup=true
